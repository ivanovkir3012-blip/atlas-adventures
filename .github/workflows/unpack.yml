
name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unpack ZIP
        shell: bash
        run: |
          set -e

          ARCHIVE="./atlas_priklyucheniya_mvp_0_1.zip"

          if [ ! -f "$ARCHIVE" ]; then
            echo "ERROR: ZIP archive not found: $ARCHIVE"
            echo "Files in repository root:"
            ls -la
            exit 1
          fi

          echo "Found archive: $ARCHIVE"

          mkdir -p extracted
          unzip -o "$ARCHIVE" -d extracted

          echo "Archive contents:"
          find extracted -maxdepth 3 -type f

          cp -R extracted/. .
          rm -rf extracted
          rm -f "$ARCHIVE"

      - name: Save files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unpack project files"
            git push
          fi
