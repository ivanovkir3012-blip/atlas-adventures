name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack ZIP
        run: |
          unzip -o atlas_priklyucheniya_mvp_0_1.zip -d extracted
          cp -R extracted/. .
          rm -rf extracted
          rm atlas_priklyucheniya_mvp_0_1.zip

      - name: Save files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Unpack project files"
          git push
