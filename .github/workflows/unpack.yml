
name: Unpack project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Find and unpack ZIP
        shell: bash
        run: |
          set -e

          ARCHIVE=$(find . -maxdepth 1 -type f -iname "*.zip" -print -quit)

          if [ -z "$ARCHIVE" ]; then
            echo "ERROR: ZIP archive not found"
            ls -la
            exit 1
          fi

          echo "Found archive: $ARCHIVE"

          mkdir -p extracted
          unzip -o "$ARCHIVE" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 3 -type f

          cp -R extracted/. .
          rm -rf extracted
          rm -f "$ARCHIVE"

      - name: Save files
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Unpack project files"
            git push
          fi
          
